<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" role="img" aria-labelledby="title desc">
<title id="title">Disparador editorial sobre el relato de Natalia</title>
<desc id="desc">¿Y qué tanto más puede hacer un centro de salud en todas estas situaciones?</desc>
<defs>
  <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="7" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .12"/></feComponentTransfer>
  </filter>
  <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".018" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
  </filter>
</defs>
<rect width="1080" height="1440" fill="#d8d2bd"/>
<rect width="1080" height="1440" fill="#7a715b" opacity=".12" filter="url(#paper)"/>
<g transform="translate(225 215) rotate(1)" filter="url(#rough)" font-family="Arial Black, Impact, sans-serif" font-weight="900" fill="#151515">
  <text x="0" y="85" font-size="92">¿Y</text>
  <rect x="155" y="12" width="280" height="98" rx="6" fill="#d71920" transform="rotate(-2 295 61)"/>
  <text x="175" y="88" font-size="92" fill="#111">QUÉ</text>

  <rect x="0" y="135" width="590" height="105" rx="6" fill="#d71920" transform="rotate(1 295 187)"/>
  <text x="22" y="218" font-size="91">TANTO MÁS</text>

  <text x="8" y="335" font-size="96">PUEDE</text>

  <rect x="16" y="365" width="335" height="108" rx="6" fill="#d71920" transform="rotate(-1 183 419)"/>
  <text x="35" y="449" font-size="94">HACER</text>

  <text x="7" y="565" font-size="92">UN CENTRO</text>
  <text x="8" y="670" font-size="92">DE</text>
  <rect x="145" y="590" width="450" height="108" rx="6" fill="#d71920" transform="rotate(1 370 644)"/>
  <text x="165" y="675" font-size="92">SALUD?</text>

  <text x="0" y="790" font-size="72">EN TODAS ESTAS</text>

  <rect x="2" y="835" width="625" height="112" rx="6" fill="#d71920" transform="rotate(-1 314 891)"/>
  <text x="20" y="922" font-size="86">SITUACIONES?</text>
</g>
</svg>